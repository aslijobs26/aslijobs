# Render Blueprint for AsliJobs API (optional — dashboard settings can mirror this).
#
# CRITICAL: With NODE_ENV=production, plain `npm install` omits devDependencies.
# TypeScript compilation needs typescript + @types/* at BUILD time.
# Use `npm run render-build` (== npm ci --include=dev && npm run build).
#
# Runtime start remains `npm start` (node dist/server.js).
# NODE_ENV must stay production for database safety guards.

services:
  - type: web
    name: aslijobs-backend
    runtime: node
    rootDir: backend
    plan: starter
    buildCommand: npm run render-build
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      # Pin LTS. `engines: ">=20"` previously let Render install Node 26 Current.
      - key: NODE_VERSION
        value: "20"
      # Keep a single Node process. This app is Express + in-process WhatsApp
      # phone-order chains (not a throng/cluster worker). Raising WEB_CONCURRENCY
      # does not add HTTP workers unless a process manager forks, and multi-process
      # would break in-memory per-phone ordering. BullMQ concurrency is separate
      # (WHATSAPP_INBOUND_CONCURRENCY).
      - key: WEB_CONCURRENCY
        value: "1"
      # Production code also forces this to 30 minutes. A short dashboard
      # value cannot send job_post_incomplete_ early.
      - key: JOB_POST_INCOMPLETE_REMINDER_DELAY_MINUTES
        value: "30"
      # Minutes after verified incomplete job seeker registration.
      - key: JOBSEEKER_PROFILE_COMPLETION_REMINDER_DELAY_MINUTES
        value: "30"
      # Set remaining secrets in the Render dashboard (never commit URIs/secrets):
      # MONGO_URI, JWT_*, WHATSAPP_*, FRONTEND_URL, ADMIN_URL, etc.
